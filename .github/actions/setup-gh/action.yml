name: Prepare GitHub CLI
description: Install a verified GitHub CLI in the job temporary directory
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        version=2.102.0
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            platform=linux_amd64; extension=tar.gz
            checksum=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 ;;
          Linux-ARM64)
            platform=linux_arm64; extension=tar.gz
            checksum=7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484 ;;
          macOS-X64)
            platform=macOS_amd64; extension=zip
            checksum=b245f24eb2bf5f75b426b4c26da3651a107f8d5b6f4fddfbfccc5679041378b3 ;;
          macOS-ARM64)
            platform=macOS_arm64; extension=zip
            checksum=da922c20d1792e5b2cbf375593d7a658acf034c12c84e007e71c76ef959c337e ;;
          *) echo "::error::Unsupported GitHub CLI runner: $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        directory=$(mktemp -d "$RUNNER_TEMP/github-cli.XXXXXX")
        archive="$directory/gh.$extension"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/cli/cli/releases/download/v$version/gh_${version}_${platform}.$extension" \
          --output "$archive"
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$archive")
        else
          actual=$(shasum -a 256 "$archive")
        fi
        test "${actual%% *}" = "$checksum" || { echo '::error::GitHub CLI checksum mismatch'; exit 1; }
        if [ "$extension" = zip ]; then
          unzip -q "$archive" -d "$directory"
        else
          tar -xzf "$archive" -C "$directory"
        fi
        bin="$directory/gh_${version}_${platform}/bin"
        "$bin/gh" --version
        echo "$bin" >> "$GITHUB_PATH"
