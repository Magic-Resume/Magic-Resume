name: Web unit tests

# Run the restored app regressions and colocated v3 unit suites on PRs.
# Web HTTP tests use ephemeral loopback backends, with no external AI service.
on:
  pull_request:
    branches: ["master", "release-*"]
  push:
    branches: ["master"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: web-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Release PR automation contracts
        run: node --test .github/release-pr/ensure-release-pr.test.cjs
      - name: Local-only boundary
        run: node scripts/check-local-only.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web tests import workspace packages from their built dist.
      - run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm --filter @magic-resume/web run test:unit

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @magic-resume/agent run typecheck
      - run: pnpm --filter @magic-resume/agent run lint
      - run: pnpm --filter @magic-resume/agent run test
