name: Release

# Auto-release on push to master via semantic-release + gitmoji.
# Version bump is derived from the gitmoji of each commit since the last tag:
#   💥 :boom: → major   ✨ :sparkles: → minor   🐛/♻️/💄/… → patch   (docs/chore/ci → no release)
# Produces: git tag vX.Y.Z + a GitHub Release with generated notes. master is
# protected (direct pushes rejected), so the tag/Release are created via the API,
# and the CHANGELOG.md update is landed through an auto-opened PR (not a push).

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: true

      # Guard against a silent version regression.
      #
      # semantic-release only considers tags reachable from the current branch. If
      # the branch history is rewritten, older tags keep pointing at commits that
      # are no longer ancestors of HEAD — semantic-release then reports "no previous
      # release" and cuts an initial 1.0.0, regardless of commit types. That is what
      # happened in August 2026: every v2.x tag was orphaned by a history rewrite and
      # the next push produced v1.0.0 on a `:memo: docs` commit, below the v2.5.0
      # that already existed.
      #
      # Failing here is the point. A red workflow is trivially recoverable; a
      # published version that goes backwards is not.
      - name: Verify the highest release tag is still reachable
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)"

          if [ -z "$latest" ]; then
            echo "No release tags exist yet — treating this as a genuine first release."
            exit 0
          fi

          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "OK — $latest is an ancestor of HEAD; semantic-release will build on it."
            exit 0
          fi

          # No leading whitespace: ::error:: is only parsed as a workflow command
          # when it starts the line.
          echo "::error::Highest release tag $latest ($(git rev-parse --short "$latest")) is not reachable from HEAD — refusing to release."
          echo
          echo "semantic-release would ignore it, report 'no previous release', and cut a"
          echo "fresh 1.0.0 — a version regression. Stopping instead."
          echo
          echo "This usually means the branch history was rewritten and the old tags now"
          echo "point at orphaned commits. To fix, re-point each affected tag at its"
          echo "equivalent commit in the current history, e.g.:"
          echo
          echo "    git push origin --force <new-sha>:refs/tags/$latest"
          echo
          echo "See docs/reference/release-automation.md for the full procedure."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install the release toolchain in an isolated dir so it never touches the
      # pnpm workspace (avoids workspace-protocol install friction + frozen lockfile).
      - name: Install semantic-release toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/sr" && cd "$RUNNER_TEMP/sr"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund \
            semantic-release@24 \
            semantic-release-gitmoji@1 \
            @semantic-release/changelog@6 \
            @semantic-release/github@11

      # Runs semantic-release: creates the tag + GitHub Release (via API) and writes
      # the CHANGELOG.md update into the working tree (the @semantic-release/git plugin
      # is intentionally absent — we don't push to protected master). Capture the new
      # version so the next step can title the changelog PR.
      - name: Release
        id: sr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          "$RUNNER_TEMP/sr/node_modules/.bin/semantic-release" 2>&1 | tee "$RUNNER_TEMP/sr.log"
          v="$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/sr.log" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1 || true)"
          if [ -n "$v" ]; then
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Land the CHANGELOG.md change through a PR (respects branch protection).
      # Skipped when no release was cut.
      - name: Open CHANGELOG pull request
        if: steps.sr.outputs.published == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: CHANGELOG.md
          base: master
          branch: chore/changelog-v${{ steps.sr.outputs.version }}
          delete-branch: true
          commit-message: ":memo: docs(changelog): update for v${{ steps.sr.outputs.version }}"
          title: ":memo: docs(changelog): v${{ steps.sr.outputs.version }}"
          body: |
            Automated `CHANGELOG.md` update for **v${{ steps.sr.outputs.version }}**.
            Full notes are on the [GitHub Release](../../releases/tag/v${{ steps.sr.outputs.version }}).
            Merge to keep the in-repo changelog in sync — this PR is `:memo: docs`, so it does not trigger another release.
